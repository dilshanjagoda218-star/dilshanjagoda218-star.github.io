                "name": "Where is Funky Dirt from and when did the band form?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Funky Dirt is from Colombo, Sri Lanka. The trio formed in 2007 as a school band called MACS at Isipathana College before becoming Funky Dirt."
                }
              },

                "@type": "Question",
                "name": "What songs is Funky Dirt known for?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Funky Dirt is known for Sereppuwa, Ada Ape Thaththa, Bus Eke, Watey Gihin, Hollala, Doppi Nakin, Eka Tamai Meka and Awidan Yanawa with Yohani. Their 2025 single Oba Dakmen was the PPL official theme song."
                }
              },
