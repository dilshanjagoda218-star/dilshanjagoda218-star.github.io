<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found — Funky Dirt</title>
    <meta name="theme-color" content="#f0f0f0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      :root {
        --bg: #f0f0f0;
        --ink: #111111;
        --muted: #555555;
        --gold: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Poppins", system-ui, "Segoe UI", sans-serif;
        text-align: center;
      }

      main {
        max-width: 520px;
      }

      .logo {
        width: 120px;
        height: auto;
        margin: 0 auto 28px;
        display: block;
      }

      .code {
        display: inline-block;
        margin: 0 0 16px;
        padding: 6px 14px;
        border: 1px solid rgba(0, 0, 0, 0.14);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 3px;
      }

      h1 {
        margin: 0 0 14px;
        font-family: "Montserrat", system-ui, sans-serif;
        font-size: clamp(32px, 6vw, 48px);
        line-height: 1.05;
        letter-spacing: -1px;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.7;
      }

      a {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        border-bottom: 3px solid var(--gold);
      }

      a:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/logo.png" alt="Funky Dirt logo" width="120" height="115" />
      <p class="code">404</p>
      <h1>This groove doesn't exist.</h1>
      <p>The page you were looking for has moved or never made it to the stage. Head back to the home page for music, videos and bookings.</p>
      <a href="/">Back to Funky Dirt</a>
    </main>
  </body>
</html>
